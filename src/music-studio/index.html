<!doctype html>
<html lang="pt-BR" data-theme-resolved="dark">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Resolve the theme before first paint to avoid a flash.
      try {
        var t = (JSON.parse(localStorage.getItem('music-studio:prefs') || '{}').theme) || 'system';
        var dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.themeResolved = dark ? 'dark' : 'light';
      } catch (e) {}
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#16181b" />
    <title>Estúdio de Música</title>
    <meta name="description" content="O Estúdio de Música é uma estação de produção musical gratuita e de código aberto no navegador. Programe batidas no sequenciador, escreva melodias no piano roll, arranje músicas na playlist e mixe com efeitos de estúdio." />
    <meta name="keywords" content="online music production, beat maker, DAW in browser, step sequencer, piano roll, synthesizer, drum machine, mixer, Puter app" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Estúdio de Música" />
    <meta property="og:title" content="Estúdio de Música: faça música no navegador" />
    <meta property="og:description" content="Batidas, melodias, arranjo e mixagem numa estação de música gratuita e de código aberto." />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="./favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" href="./favicon-32x32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" sizes="180x180" />
    <link rel="manifest" href="./manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Estúdio de Música" />
    <script src="https://js.puter.com/v2/"></script>
  </head>
  <body>
    <div id="app"></div>
    <noscript>Music Studio needs JavaScript to run.</noscript>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
