    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Whiteboard",
        "url": "https://whiteboard.puter.com/",
        "description": "A little space for your next big idea. A personal whiteboard for thinking, planning, and creating.",
        "applicationCategory": "ProductivityApplication",
        "operatingSystem": "Any"
      }
    </script>
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <script>
      // The app's scripts wait for Puter's, so the saved or system theme is
      // applied now, before the first paint, as main.js applies it later.
      try {
        const theme = localStorage.getItem("whiteboard-theme") || "system";
        document.documentElement.dataset.theme =
          theme !== "system"
            ? theme
            : matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
      } catch {}
    </script>
    <script src="https://js.puter.com/v2/" defer></script>
    <!-- Privacy-friendly analytics by Plausible -->
    <script
      async
      src="https://plausible.io/js/pa--UmNYuArwFIotGMhLBsCo.js"
    ></script>
    <script>
      window.plausible =
        window.plausible ||
        function () {

        };
      plausible.init =
        plausible.init ||
        function (i) {
          plausible.o = i || {};
        };
      plausible.init();
    </script>

  <body>
    <div id="app">
      <p class="app-loading" role="status">Loading your boards…</p>
    </div>
    <div id="toast" role="status" aria-live="polite"></div>
