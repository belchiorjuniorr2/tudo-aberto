<!doctype html>
<html lang="pt-BR" data-theme-resolved="dark">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Resolve the theme before first paint to avoid a flash.
      try {
        var t = (JSON.parse(localStorage.getItem('audio-studio:prefs') || '{}').theme) || 'system';
        var dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.themeResolved = dark ? 'dark' : 'light';
      } catch (e) {}
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#161616" />
    <title>Estúdio de Áudio</title>
    <meta name="description" content="O Estúdio de Áudio é um editor de áudio por forma de onda e multipista no navegador. Grave, edite, restaure, mixe e masterize, com edição espectral e efeitos de estúdio, salvo na sua própria nuvem Puter." />
    <meta name="keywords" content="online audio editor, multitrack audio editor, waveform editor, spectral editor, noise reduction, record audio online, podcast editor, Puter app" />
    <link rel="canonical" href="https://audio-editor.app/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Estúdio de Áudio" />
    <meta property="og:title" content="Estúdio de Áudio: edição de áudio por forma de onda e multipista no navegador" />
    <meta property="og:description" content="Grave, edite, restaure, mixe e masterize áudio no navegador, salvo na sua própria nuvem." />
    <meta property="og:url" content="https://audio-editor.app/" />
    <meta property="og:image" content="https://audio-editor.app/social-graph.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="./favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" href="./favicon-16x16.png" type="image/png" sizes="16x16" />
    <link rel="icon" href="./favicon-32x32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="./favicon-48x48.png" type="image/png" sizes="48x48" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" sizes="180x180" />
    <link rel="manifest" href="./manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Estúdio de Áudio" />
    <script src="https://js.puter.com/v2/"></script>
  </head>
  <body>
    <div id="app" class="app"></div>
    <noscript>Audio Studio needs JavaScript to run.</noscript>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
