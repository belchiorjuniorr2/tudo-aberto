  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "@id": "https://cap-table.io/#software",
      "url": "https://cap-table.io/",
      "image": "https://cap-table.io/icon-512.png",
      "name": "Cap Table",
      "alternateName": "Cap Table by Puter",
      "applicationCategory": "BusinessApplication",
      "applicationSubCategory": "Cap table management software",
      "operatingSystem": "Web",
      "description": "Free cap table software for startups to manage ownership, track equity and vesting, and model fundraising dilution.",
      "isAccessibleForFree": true,
      "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },

    }
  </script>
  <meta name="theme-color" content="#f7f7f8" media="(prefers-color-scheme: light)" />
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "@id": "https://cap-table.io/#website",
      "url": "https://cap-table.io/",
      "name": "Cap Table",
      "alternateName": "Cap Table by Puter",
      "inLanguage": "en"
    }
  </script>
  <meta name="theme-color" content="#0e0f11" media="(prefers-color-scheme: dark)" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Tabela de Capitalização" />
  <link rel="icon" href="./favicon.ico" sizes="16x16 32x32 48x48" />
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
  <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="stylesheet" href="/src/styles/index.css" />
  <style>
    html:not(.js) [data-sign-in] { display: none; }
  </style>
  <script>
    document.documentElement.classList.add('js');
    // Apply the saved theme before first paint to avoid a flash.
    (() => {
      try {
        const t = localStorage.getItem('captable:theme');
        if (t !== 'light' && t !== 'dark') return;
        document.documentElement.dataset.theme = t;
        // The browser chrome follows the saved theme too, not the OS one:
        // applyTheme() only runs after sign-in and the first load, and the
        // sign-in and error screens sat under a title bar of the other color.
        for (const m of document.querySelectorAll('meta[name="theme-color"]')) {
          m.setAttribute('content', t === 'dark' ? '#0e0f11' : '#f7f7f8');
        }
      } catch {}
    })();
  </script>
  <!-- Navigation and public content work while the independent SDK loads.
       main.js waits for its load/error event before checking the session. -->
  <script src="https://js.puter.com/v2/" async data-puter-sdk onload="this.dataset.loaded = 'true'" onerror="this.dataset.failed = 'true'"></script>
  <script type="module" src="/src/main.js"></script>
</head>
<body>
  <noscript>Enable JavaScript to sign in with Puter and use this free cap table software.</noscript>
  <div id="app" class="app">
    <!-- public-landing -->
  </div>
</body>
</html>
